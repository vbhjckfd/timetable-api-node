name = "stop-overrides"
main = "src/index.js"
compatibility_date = "2026-08-07"

# Same origin as the /stops listing that reads it: no CORS, no preflight, and
# the Access cookie is already scoped to this hostname.
[[routes]]
pattern = "api.lad.lviv.ua/stop-overrides*"
zone_name = "lad.lviv.ua"

# The Worker is only meant to be reachable through the zone, where Access sits
# in front of the admin path.
workers_dev = false

[[kv_namespaces]]
binding = "STOP_OVERRIDES"
id = "46ab3cf327a642529ce22c895be007f8"

[vars]
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
